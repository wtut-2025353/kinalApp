<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Usuario | KinalApp</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header class="header">
    <div class="header-content">
        <a th:href="@{/home}" class="logo-link">
            <img th:src="@{/images/kinal.png}" alt="KinalApp Logo">
            <span class="logo-text">KinalApp</span>
        </a>
    </div>
</header>

<div class="container">
    <div class="card">
        <div class="card-header">
            <h1>Editar Usuario</h1>
            <p class="subtitle">Modificar datos del usuario</p>
        </div>

        <div th:if="${mensaje}" class="alert-success">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                <polyline points="22 4 12 14.01 9 11.01"/>
            </svg>
            <span th:text="${mensaje}">Mensaje</span>
        </div>

        <div th:if="${error}" class="alert-error">
            <span th:text="${error}">Error</span>
        </div>

        <form th:action="@{/usuarios/{codigo}/editar(codigo=${usuario.codigoUsuario})}" th:object="${usuario}" method="post" class="form">
            <div class="form-group">
                <label for="codigoUsuario">Codigo</label>
                <input type="text" id="codigoUsuario" th:field="*{codigoUsuario}" readonly class="readonly">
            </div>

            <div class="form-group">
                <label for="username">Nombre de Usuario *</label>
                <input type="text" id="username" th:field="*{username}" placeholder="Ingrese el nombre de usuario" required>
            </div>

            <div class="form-group">
                <label for="password">Contrasena *</label>
                <input type="password" id="password" th:field="*{password}" placeholder="Ingrese la contrasena" required>
            </div>

            <div class="form-group">
                <label for="email">Email *</label>
                <input type="email" id="email" th:field="*{email}" placeholder="Ingrese el correo electronico" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="rol">Rol *</label>
                    <select id="rol" th:field="*{rol}" required>
                        <option value="ROLE_ADMIN">Administrador</option>
                        <option value="ROLE_USER">Usuario Regular</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="estado">Estado *</label>
                    <select id="estado" th:field="*{estado}" required>
                        <option th:value="1">Activo</option>
                        <option th:value="0">Inactivo</option>
                    </select>
                </div>
            </div>

            <button type="submit" class="btn-submit">Actualizar Usuario</button>
            <a th:href="@{/usuarios}" class="btn-secondary">Cancelar</a>
        </form>
    </div>
</div>
</body>
</html>
