<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | KinalApp</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <div class="card">
        <div class="card-header">
            <h1>Iniciar Sesion</h1>
            <p class="subtitle">Ingrese sus credenciales para acceder</p>
        </div>

        <div th:if="${param.error}" class="alert-error">
            <span>Email o contrasena incorrectos</span>
        </div>

        <div th:if="${param.logout}" class="alert-success">
            <span>Sesion cerrada exitosamente</span>
        </div>

        <form th:action="@{/login}" method="post" class="form">
            <div class="form-group">
                <label for="email">Email *</label>
                <div class="input-wrapper">
                    <input type="email" id="email" name="email" placeholder="Ingrese su correo electronico" required>
                </div>
            </div>

            <div class="form-group">
                <label for="password">Contrasena *</label>
                <div class="input-wrapper">
                    <input type="password" id="password" name="password" placeholder="Ingrese su contrasena" required>
                </div>
            </div>

            <button type="submit" class="btn-submit">
                <span>Iniciar Sesion</span>
            </button>
        </form>

        <div style="text-align: center; margin-top: 20px;">
            <p>¿No tienes cuenta? <a th:href="@{/usuarios/registro}" style="color: #4CAF50; text-decoration: none; font-weight: bold;">Registrate aqui</a></p>
        </div>
    </div>
</div>
</body>
</html>
