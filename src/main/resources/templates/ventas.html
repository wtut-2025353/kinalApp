<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ventas | KinalApp</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header class="header">
    <div class="header-content">
        <a th:href="@{/home}" class="logo-link">
            <img th:src="@{/images/kinal.png}" alt="KinalApp Logo">
            <span class="logo-text">KinalApp</span>
        </a>
    </div>
</header>

<div class="container-wide">
    <div class="card">
        <div class="card-header">
            <h1>Listado de Ventas</h1>
            <p class="subtitle">Gestion de ventas registradas</p>
        </div>

        <div th:if="${mensaje}" class="alert-success">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                <polyline points="22 4 12 14.01 9 11.01"/>
            </svg>
            <span th:text="${mensaje}">Mensaje</span>
        </div>

        <div th:if="${error}" class="alert-error">
            <span th:text="${error}">Error</span>
        </div>

        <div class="actions">
            <a th:href="@{/ventas/nueva}" class="btn-nuevo">+ Nueva Venta</a>
            <a th:href="@{/home}" class="btn-secondary" style="width: auto;">Volver al inicio</a>
        </div>

        <div class="table-container">
            <table class="table">
                <thead>
                    <tr>
                        <th>Codigo</th>
                        <th>Fecha</th>
                        <th>Cliente</th>
                        <th>Vendedor</th>
                        <th>Total</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="venta : ${ventas}">
                        <td th:text="${venta.codigoVenta}">Codigo</td>
                        <td th:text="${#temporals.format(venta.fechaVenta, 'dd/MM/yyyy HH:mm')}">Fecha</td>
                        <td th:text="${venta.cliente != null ? venta.cliente.nombreCliente + ' ' + venta.cliente.apellidoCliente : 'Sin cliente'}">Cliente</td>
                        <td th:text="${venta.usuario != null ? venta.usuario.username : 'Sin usuario'}">Usuario</td>
                        <td style="font-weight: 600; color: #7ec8f0;" th:text="${venta.total != null ? 'Q' + #numbers.formatDecimal(venta.total, 1, 2) : 'Q0.00'}">Total</td>
                        <td>
                            <span th:class="${venta.estado == 1} ? 'badge badge-activo' : 'badge badge-inactivo'" 
                                  th:text="${venta.estado == 1 ? 'Activa' : 'Anulada'}">Estado</span>
                        </td>
                        <td>
                            <a th:href="@{/ventas/ver/{id}(id=${venta.codigoVenta})}" class="btn-view">Ver</a>
                            <a th:href="@{/ventas/editar/{id}(id=${venta.codigoVenta})}" class="btn-edit">Editar</a>
                            <a th:href="@{/ventas/eliminar/{id}(id=${venta.codigoVenta})}" class="btn-delete">Eliminar</a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(ventas)}">
                        <td colspan="7" class="empty-state">
                            <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" style="margin-bottom: 16px; opacity: 0.5;">
                                <circle cx="8" cy="21" r="1"/>
                                <circle cx="19" cy="21" r="1"/>
                                <path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/>
                            </svg>
                            <p>No hay ventas registradas</p>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
