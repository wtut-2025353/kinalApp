<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos | KinalApp</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header class="header">
    <div class="header-content">
        <a th:href="@{/home}" class="logo-link">
            <img th:src="@{/images/kinal.png}" alt="KinalApp Logo">
            <span class="logo-text">KinalApp</span>
        </a>
    </div>
</header>

<div class="container-wide">
    <div class="card">
        <div class="card-header">
            <h1>Listado de Productos</h1>
            <p class="subtitle">Gestion de productos</p>
        </div>

        <div th:if="${mensaje}" class="alert-success">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                <polyline points="22 4 12 14.01 9 11.01"/>
            </svg>
            <span th:text="${mensaje}">Mensaje</span>
        </div>

        <div th:if="${error}" class="alert-error">
            <span th:text="${error}">Error</span>
        </div>

        <div class="actions">
            <a th:href="@{/productos/nuevo}" class="btn-nuevo">+ Nuevo Producto</a>
            <a th:href="@{/home}" class="btn-secondary" style="width: auto;">Volver al inicio</a>
        </div>

        <div class="table-container">
            <table class="table">
                <thead>
                    <tr>
                        <th>Codigo</th>
                        <th>Nombre</th>
                        <th>Precio</th>
                        <th>Stock</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="producto : ${productos}">
                        <td th:text="${producto.codigoProducto}">Codigo</td>
                        <td th:text="${producto.nombreProducto}">Nombre</td>
                        <td style="font-weight: 600; color: #7ec8f0;" th:text="'Q' + ${#numbers.formatDecimal(producto.precio, 1, 2)}">Precio</td>
                        <td th:text="${producto.stock}">Stock</td>
                        <td>
                            <span th:class="${producto.estado == 1} ? 'badge badge-activo' : 'badge badge-inactivo'" 
                                  th:text="${producto.estado == 1 ? 'Activo' : 'Inactivo'}">Estado</span>
                        </td>
                        <td>
                            <a th:href="@{/productos/editar/{codigo}(codigo=${producto.codigoProducto})}" class="btn-edit">Editar</a>
                            <a th:href="@{/productos/eliminar/{codigo}(codigo=${producto.codigoProducto})}" class="btn-delete">Eliminar</a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(productos)}">
                        <td colspan="6" class="empty-state">
                            <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" style="margin-bottom: 16px; opacity: 0.5;">
                                <path d="m7.5 4.27 9 5.15"/>
                                <path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/>
                                <path d="m3.3 7 8.7 5 8.7-5"/>
                                <path d="M12 22V12"/>
                            </svg>
                            <p>No hay productos registrados</p>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
