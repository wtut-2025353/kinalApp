<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle de Venta | KinalApp</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container-wide">
    <div class="card">
        <div class="card-header">
            <h1>Detalle de Venta</h1>
            <p class="subtitle" th:text="'Venta #' + ${venta.codigoVenta}">Venta</p>
        </div>

        <div th:if="${mensaje}" class="alert-success">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                <polyline points="22 4 12 14.01 9 11.01"/>
            </svg>
            <span th:text="${mensaje}">Mensaje</span>
        </div>

        <div class="form-row" style="background: rgba(8, 16, 36, 0.5); padding: 24px; border-radius: 16px; border: 1px solid rgba(100, 160, 220, 0.1); margin-bottom: 32px;">
            <div class="form-group">
                <label style="font-size: 0.75rem;">Codigo de Venta</label>
                <div style="font-size: 1.1rem; font-weight: 600; color: #7ec8f0;" th:text="${venta.codigoVenta}">000</div>
            </div>
            <div class="form-group">
                <label style="font-size: 0.75rem;">Fecha</label>
                <div style="font-size: 1rem; color: #c8dcf0;" th:text="${#temporals.format(venta.fechaVenta, 'dd/MM/yyyy HH:mm')}">Fecha</div>
            </div>
            <div class="form-group">
                <label style="font-size: 0.75rem;">Cliente</label>
                <div style="font-size: 1rem; color: #c8dcf0;" th:text="${venta.cliente != null ? venta.cliente.nombreCliente + ' ' + venta.cliente.apellidoCliente : 'Sin cliente'}">Cliente</div>
            </div>
            <div class="form-group">
                <label style="font-size: 0.75rem;">Vendedor</label>
                <div style="font-size: 1rem; color: #c8dcf0;" th:text="${venta.usuario != null ? venta.usuario.username : 'Sin usuario'}">Usuario</div>
            </div>
            <div class="form-group">
                <label style="font-size: 0.75rem;">Estado</label>
                <div>
                    <span th:class="${venta.estado == 1} ? 'badge badge-activo' : 'badge badge-inactivo'" 
                          th:text="${venta.estado == 1 ? 'Activa' : 'Anulada'}">Estado</span>
                </div>
            </div>
        </div>

        <h3 style="margin-bottom: 20px; font-size: 1.1rem; color: #a8c4e0;">Productos Vendidos</h3>
        
        <div class="table-container">
            <table class="table">
                <thead>
                    <tr>
                        <th>Producto</th>
                        <th>Cantidad</th>
                        <th>Precio Unitario</th>
                        <th>Subtotal</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="detalle : ${venta.detalles}">
                        <td th:text="${detalle.producto != null ? detalle.producto.nombreProducto : 'Producto eliminado'}">Producto</td>
                        <td th:text="${detalle.cantidad}">0</td>
                        <td style="color: #7ec8f0;" th:text="${detalle.precioUnitario != null ? 'Q' + #numbers.formatDecimal(detalle.precioUnitario, 1, 2) : 'Q0.00'}">Q0.00</td>
                        <td style="font-weight: 600; color: #7ec8f0;" th:text="${detalle.subtotal != null ? 'Q' + #numbers.formatDecimal(detalle.subtotal, 1, 2) : 'Q0.00'}">Q0.00</td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(venta.detalles)}">
                        <td colspan="4" class="empty-state">
                            <p>No hay productos en esta venta</p>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="total-box">
            Total: Q<span th:text="${venta.total != null ? #numbers.formatDecimal(venta.total, 1, 2) : '0.00'}">0.00</span>
        </div>

        <div class="actions">
            <a th:href="@{/ventas/editar/{id}(id=${venta.codigoVenta})}" class="btn-edit">Editar Venta</a>
            <a th:href="@{/ventas}" class="btn-secondary" style="width: auto;">Volver al Listado</a>
        </div>
    </div>
</div>
</body>
</html>
