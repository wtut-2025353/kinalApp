<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuarios | KinalApp</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header class="header">
    <div class="header-content">
        <a th:href="@{/home}" class="logo-link">
            <img th:src="@{/images/kinal.png}" alt="KinalApp Logo">
            <span class="logo-text">KinalApp</span>
        </a>
    </div>
</header>

<div class="container-wide">
    <div class="card">
        <div class="card-header">
            <h1>Listado de Usuarios</h1>
            <p class="subtitle">Gestion de usuarios del sistema</p>
        </div>

        <div th:if="${mensaje}" class="alert-success">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                <polyline points="22 4 12 14.01 9 11.01"/>
            </svg>
            <span th:text="${mensaje}">Mensaje</span>
        </div>

        <div th:if="${error}" class="alert-error">
            <span th:text="${error}">Error</span>
        </div>

        <div class="actions">
            <a th:href="@{/usuarios/registro}" class="btn-nuevo">+ Nuevo Usuario</a>
            <a th:href="@{/home}" class="btn-secondary" style="width: auto;">Volver al inicio</a>
        </div>

        <div class="table-container">
            <table class="table">
                <thead>
                    <tr>
                        <th>Codigo</th>
                        <th>Username</th>
                        <th>Email</th>
                        <th>Rol</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="usuario : ${usuarios}">
                        <td th:text="${usuario.codigoUsuario}">Codigo</td>
                        <td th:text="${usuario.username}">Username</td>
                        <td th:text="${usuario.email}">Email</td>
                        <td>
                            <span class="badge" style="background: rgba(100, 181, 246, 0.15); color: #64b5f6; border: 1px solid rgba(100, 181, 246, 0.25);" 
                                  th:text="${usuario.rol}">Rol</span>
                        </td>
                        <td>
                            <span th:class="${usuario.estado == 1} ? 'badge badge-activo' : 'badge badge-inactivo'" 
                                  th:text="${usuario.estado == 1 ? 'Activo' : 'Inactivo'}">Estado</span>
                        </td>
                        <td>
                            <a th:href="@{/usuarios/{codigo}/editar(codigo=${usuario.codigoUsuario})}" class="btn-edit">Editar</a>
                            <a th:href="@{/usuarios/{codigo}/eliminar(codigo=${usuario.codigoUsuario})}" class="btn-delete">Eliminar</a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(usuarios)}">
                        <td colspan="6" class="empty-state">
                            <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" style="margin-bottom: 16px; opacity: 0.5;">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                                <circle cx="12" cy="7" r="4"/>
                            </svg>
                            <p>No hay usuarios registrados</p>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
