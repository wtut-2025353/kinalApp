<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Cliente | KinalApp</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header class="header">
    <div class="header-content">
        <a th:href="@{/home}" class="logo-link">
            <img th:src="@{/images/kinal.png}" alt="KinalApp Logo">
            <span class="logo-text">KinalApp</span>
        </a>
    </div>
</header>

<div class="container">
    <div class="card">
        <div class="card-header">
            <h1>Editar Cliente</h1>
            <p class="subtitle">Modifique los datos del cliente</p>
        </div>

        <div th:if="${mensaje}" class="alert-success">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                <polyline points="22 4 12 14.01 9 11.01"/>
            </svg>
            <span th:text="${mensaje}">Mensaje</span>
        </div>

        <div th:if="${error}" class="alert-error">
            <span th:text="${error}">Error</span>
        </div>

        <form th:action="@{/clientes/{dpi}/editar(dpi=${cliente.DPICliente})}" th:object="${cliente}" method="post" class="form">
            <div class="form-group">
                <label for="DPICliente">DPI</label>
                <input type="text" id="DPICliente" th:field="*{DPICliente}" readonly class="readonly">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="nombreCliente">Nombre *</label>
                    <input type="text" id="nombreCliente" th:field="*{nombreCliente}" placeholder="Ingrese el nombre" required>
                </div>

                <div class="form-group">
                    <label for="apellidoCliente">Apellido *</label>
                    <input type="text" id="apellidoCliente" th:field="*{apellidoCliente}" placeholder="Ingrese el apellido" required>
                </div>
            </div>

            <div class="form-group">
                <label for="direccion">Direccion *</label>
                <input type="text" id="direccion" th:field="*{direccion}" placeholder="Ingrese la direccion completa" required>
            </div>

            <div class="form-group">
                <label for="estado">Estado *</label>
                <select id="estado" th:field="*{estado}" required>
                    <option th:value="1">Activo</option>
                    <option th:value="0">Inactivo</option>
                </select>
            </div>

            <button type="submit" class="btn-submit">Actualizar Cliente</button>
            <a th:href="@{/clientes}" class="btn-secondary">Cancelar</a>
        </form>
    </div>
</div>
</body>
</html>
